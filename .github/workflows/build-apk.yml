name: Build Jarvis Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: 🤖 Build Jarvis APK
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le code
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # 2. Configurer Java 17
      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Télécharger le gradle-wrapper.jar manquant
      - name: 📦 Download Gradle Wrapper JAR
        run: |
          mkdir -p jarvis-android-app/gradle/wrapper
          curl -fL -o jarvis-android-app/gradle/wrapper/gradle-wrapper.jar \
            "https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar"

      # 4. Installer Android SDK via sdkmanager
      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. Cache Gradle
      - name: 💾 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      # 6. Rendre gradlew exécutable et compiler
      - name: 🔨 Build Debug APK
        run: |
          chmod +x jarvis-android-app/gradlew
          cd jarvis-android-app
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1

      # 7. Upload l'APK
      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Android-APK
          path: jarvis-android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # 8. Résumé
      - name: 📊 APK Info
        run: |
          APK="jarvis-android-app/app/build/outputs/apk/debug/app-debug.apk"
          [ -f "$APK" ] && echo "✅ APK OK — $(du -sh $APK | cut -f1)" || (echo "❌ APK manquante" && exit 1)
