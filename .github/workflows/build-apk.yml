name: Build Jarvis Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: 🤖 Build Jarvis APK
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le code
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # 2. Configurer Java 17
      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Télécharger le gradle-wrapper.jar
      - name: 📦 Download Gradle Wrapper JAR
        run: |
          mkdir -p gradle/wrapper
          curl -fL -o gradle/wrapper/gradle-wrapper.jar "https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar"

      # 4. Accepter les licences SDK Android préinstallées
      - name: 📱 Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true

      # 5. Compiler l'APK
      - name: 🔨 Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      # 6. Upload de l'APK générée
      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # 7. Affichage du résultat
      - name: 📊 APK Info
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK" ]; then
            echo "✅ APK créée avec succès !"
            ls -lh "$APK"
          else
            echo "❌ APK introuvable"
            exit 1
          fi
