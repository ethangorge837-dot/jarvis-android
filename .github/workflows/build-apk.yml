name: Build Jarvis Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # Permet de lancer manuellement depuis GitHub

jobs:
  build-apk:
    name: 🤖 Build Jarvis APK
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le code
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # 2. Configurer Java 17 (requis pour AGP 8.x)
      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Rendre gradlew exécutable
      - name: 🔧 Grant execute permission for gradlew
        run: chmod +x jarvis-android-app/gradlew

      # 4. Cache Gradle pour accélérer les builds suivants
      - name: 📦 Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 5. Compiler l'APK debug (pas besoin de keystore)
      - name: 🔨 Build Debug APK
        run: |
          cd jarvis-android-app
          ./gradlew assembleDebug --no-daemon --stacktrace

      # 6. Uploader l'APK comme artifact téléchargeable
      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Android-APK
          path: jarvis-android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # 7. Afficher la taille de l'APK
      - name: 📊 APK Info
        run: |
          APK_PATH="jarvis-android-app/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            SIZE=$(du -sh "$APK_PATH" | cut -f1)
            echo "✅ APK compilée avec succès !"
            echo "📦 Taille : $SIZE"
            echo "📁 Chemin : $APK_PATH"
          else
            echo "❌ APK non trouvée"
            exit 1
          fi
